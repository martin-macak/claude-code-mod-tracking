name: release

# Start on clean main: make release VERSION=x.y.z. The tag sets the version.
# KB: docs/knowledge-base/claude-code-mods/workflow/release.md.
on:
  push:
    tags: ['artifact-tracking--v*']

permissions:
  contents: read

concurrency:
  group: release-artifact-tracking
  cancel-in-progress: false

env:
  PLUGIN: plugins/artifact-tracking
  # Keep these equal to the pins in test.yml.
  CLAUDE_CODE_VERSION: 2.1.296
  TYPESCRIPT_VERSION: 7.0.2

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release, upload assets
      issues: write # close the stable version milestone
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation
      artifact-metadata: write # store the artifact record
    outputs:
      latest-before: ${{ steps.previous.outputs.tag }}
    steps:
      # Full history: the guard checks that the tag is on main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bash scripts/release/ci.sh check-tag "$TAG")"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Stamp the tag version before validation and tests
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release/ci.sh stamp "$TAG"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache the npm download cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-claude-${{ env.CLAUDE_CODE_VERSION }}-tsc-${{ env.TYPESCRIPT_VERSION }}

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # --strict fails on warnings too. The repo root holds marketplace.json.
      - name: Validate the plugin and the marketplace
        run: |
          claude plugin validate --strict "$PLUGIN"
          claude plugin validate --strict .

      # NODE_RUN= : CI has no mise. setup-node provides node 24. Same as test.yml.
      - name: Test
        run: make test TSC="npx -y -p typescript@${TYPESCRIPT_VERSION} tsc" NODE_RUN=

      - name: Build the zip and SHA256SUMS
        run: make dist VERSION="$VERSION"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.zip

      - name: Record latest before publication
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api 'repos/{owner}/{repo}/releases/latest' --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/ci.sh publish "$TAG"

      - name: Close the stable release milestone
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/ci.sh close-milestone "$VERSION"

  smoke:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Check published archives, fresh install and old path-entry update
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LATEST_BEFORE: ${{ needs.release.outputs.latest-before }}
        run: bash scripts/release/smoke.sh "$TAG"
